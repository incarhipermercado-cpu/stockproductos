<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>Stock Compartido</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:system-ui;color:#111827}main{max-width:720px;margin:auto;padding:10px}header,.card,.k{background:white;border-radius:16px;padding:15px;margin:9px 0;box-shadow:0 2px 12px #0001}header{background:#111827;color:white}h1{margin:0;font-size:23px}.sub,.note,small{font-size:12px;color:#6b7280}header .sub{color:#bbb}.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.k{text-align:center;margin:0;padding:10px}.k b{display:block;font-size:21px}.k span{font-size:10px;color:#6b7280}label{display:block;font-weight:800;font-size:13px;margin:8px 0 5px}input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:18px}.row{display:flex;gap:8px}.row>*{flex:1}button{border:0;border-radius:12px;padding:13px;min-height:48px;font-weight:800}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.gray{background:#e5e7eb}.table{overflow:auto;max-height:430px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fafafa}#reader{display:none;position:relative;margin-top:9px;background:#000;border-radius:12px;overflow:hidden}video{width:100%;min-height:220px;object-fit:cover}.line{position:absolute;top:50%;left:8%;right:8%;height:2px;background:red}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,120px);background:#111827;color:#fff;padding:12px 15px;border-radius:12px;transition:.25s}.show{transform:translate(-50%,0)}</style></head>
<body><main><header><h1>📦 Stock Compartido</h1><div class="sub">Todos los celulares usan el mismo stock.</div></header>
<div class="kp"><div class="k"><b id="np">0</b><span>PRODUCTOS</span></div><div class="k"><b id="nu">0</b><span>UNIDADES</span></div><div class="k"><b id="nm">0</b><span>MOVIMIENTOS</span></div></div>
<section class="card"><label>Código de barras</label><div class="row"><input id="code" inputmode="numeric" placeholder="Escanear o escribir" autocomplete="off"><button id="scan" class="blue">📷 Escanear</button></div><div id="reader"><video id="video" playsinline muted></video><div class="line"></div></div>
<label>Producto (opcional)</label><input id="name" placeholder="Nombre del producto"><label>Cantidad de ingreso</label><input id="qty" type="number" min="1" value="1" inputmode="numeric"><br><button id="add" class="green" style="width:100%;margin-top:9px">➕ AGREGAR INGRESO</button><p class="note">Cada ingreso se suma al stock central. Las operaciones simultáneas se procesan de forma atómica.</p></section>
<section class="card"><label>Buscar</label><input id="search" placeholder="Código o producto"><div class="table"><table><thead><tr><th>Código</th><th>Producto</th><th>Stock</th><th>Actualizado</th></tr></thead><tbody id="body"></tbody></table></div></section>
<section class="card"><div class="row"><button id="csv" class="blue">⬇️ Exportar CSV</button><button id="refresh" class="gray">🔄 Actualizar</button></div></section></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://hqwzuocvczvdhrslyqbp.supabase.co",SB_KEY="sb_publishable_68lrYJk9x6RU2vJE-IzcvA_s1tzb1AH",db=supabase.createClient(SB_URL,SB_KEY);let rows=[],stream=null,scanning=false,detector;
const $=x=>document.getElementById(x),toast=x=>{let t=$("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2500)};
async function load(){let r=await db.from("productos_stock").select("*").order("nombre");if(r.error){toast("Ejecutá primero el SQL de configuración");console.error(r.error);return}rows=r.data||[];render()}
function render(){let q=$("search").value.toLowerCase(),a=rows.filter(p=>(p.codigo+" "+p.nombre).toLowerCase().includes(q));$("np").textContent=rows.length;$("nu").textContent=rows.reduce((s,p)=>s+Number(p.stock),0).toLocaleString("es-AR");$("nm").textContent=rows.reduce((s,p)=>s+Number(p.movimientos),0).toLocaleString("es-AR");$("body").innerHTML=a.map(p=>`<tr><td><b>${p.codigo}</b></td><td>${p.nombre||"Sin nombre"}</td><td><b>${Number(p.stock).toLocaleString("es-AR")}</b></td><td>${new Date(p.actualizado_en).toLocaleString("es-AR")}</td></tr>`).join("")||'<tr><td colspan="4" style="text-align:center;padding:20px">Sin productos</td></tr>'}
async function add(){let c=$("code").value.trim(),n=parseInt($("qty").value),nm=$("name").value.trim();if(!c||!n||n<1)return toast("Código y cantidad válida son obligatorios");$("add").disabled=true;let r=await db.rpc("ingresar_stock",{p_codigo:c,p_nombre:nm,p_cantidad:n});$("add").disabled=false;if(r.error){console.error(r.error);return toast("No se pudo registrar el ingreso")}$("qty").value=1;$("name").value="";toast("Ingreso registrado. Stock: "+Number(r.data.stock).toLocaleString("es-AR"));load()}
let scannerControls=null;

async function start(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return toast("La cámara requiere HTTPS. Abrí la aplicación desde una dirección https://");
    }
    if(!window.ZXingBrowser){
      return toast("No se pudo cargar el lector. Verificá la conexión a Internet.");
    }

    stop();
    $("reader").style.display="block";
    scanning=true;
    toast("Apuntá al código de barras");

    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    window.__zxingReader=reader;

    let devices=[];
    try{
      devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    }catch(e){ console.warn(e); }

    let deviceId;
    if(devices.length){
      const rear=devices.find(d=>/back|rear|environment|trasera|posterior/i.test(d.label||""));
      deviceId=(rear||devices[devices.length-1]).deviceId;
    }

    scannerControls=await reader.decodeFromVideoDevice(
      deviceId,
      $("video"),
      (result,error)=>{
        if(!scanning) return;
        if(result){
          const code=result.getText().trim();
          $("code").value=code;
          stop();
          $("qty").focus();
          if(navigator.vibrate) navigator.vibrate(100);
          toast("Código leído: "+code);
        }
      }
    );
  }catch(e){
    console.error(e);
    stop();
    toast("No se pudo abrir la cámara. Permití el acceso y verificá que la página use HTTPS.");
  }
}

function stop(){
  scanning=false;
  try{
    if(scannerControls && typeof scannerControls.stop==="function"){
      scannerControls.stop();
    }
  }catch(e){}
  scannerControls=null;

  try{
    if(window.__zxingReader && typeof window.__zxingReader.reset==="function"){
      window.__zxingReader.reset();
    }
  }catch(e){}
  window.__zxingReader=null;

  if(stream){
    try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
    stream=null;
  }

  const video=$("video");
  if(video){
    try{video.pause()}catch(e){}
    video.srcObject=null;
  }

  $("reader").style.display="none";
}
function csv(){let cell=x=>`"${String(x??"").replaceAll('"','""')}"`,s="\\uFEFFCodigo;Producto;Stock;Movimientos;Actualizado\\n"+rows.map(p=>[p.codigo,p.nombre,p.stock,p.movimientos,p.actualizado_en].map(cell).join(";")).join("\\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download="stock_compartido.csv";a.click()}
$("add").onclick=add;$("scan").onclick=()=>scanning?stop():start();$("search").oninput=render;$("refresh").onclick=load;$("csv").onclick=csv;$("qty").onkeydown=e=>e.key==="Enter"&&add();$("code").onkeydown=e=>e.key==="Enter"&&$("qty").focus();
(async()=>{await load();db.channel("stock").on("postgres_changes",{event:"*",schema:"public",table:"productos_stock"},load).subscribe()})();
</script></body></html>
