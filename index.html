<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>Stock Compartido</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111827
}

main{
  max-width:720px;
  margin:auto;
  padding:10px
}

header,.card,.k{
  background:white;
  border-radius:16px;
  padding:15px;
  margin:9px 0;
  box-shadow:0 2px 12px #0001
}

header{
  background:#111827;
  color:white
}

h1{
  margin:0;
  font-size:23px
}

.sub,.note,small{
  font-size:12px;
  color:#6b7280
}

header .sub{
  color:#bbb
}

.kp{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}

.k{
  text-align:center;
  margin:0;
  padding:10px
}

.k b{
  display:block;
  font-size:21px
}

.k span{
  font-size:10px;
  color:#6b7280
}

label{
  display:block;
  font-weight:800;
  font-size:13px;
  margin:8px 0 5px
}

input{
  width:100%;
  padding:14px;
  border:2px solid #e5e7eb;
  border-radius:12px;
  font-size:18px;
  outline:none
}

input:focus{
  border-color:#2563eb
}

.row{
  display:flex;
  gap:8px
}

.row>*{
  flex:1
}

button{
  border:0;
  border-radius:12px;
  padding:13px;
  min-height:48px;
  font-weight:800;
  cursor:pointer
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.blue{
  background:#2563eb;
  color:white
}

.green{
  background:#16a34a;
  color:white
}

.gray{
  background:#e5e7eb
}

.table{
  overflow:auto;
  max-height:430px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  padding:9px 6px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  white-space:nowrap
}

th{
  position:sticky;
  top:0;
  background:#fafafa
}

/* LECTOR */
#reader{
  display:none;
  position:relative;
  margin-top:10px;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:3px solid #111827
}

#video{
  display:block;
  width:100%;
  height:auto;
  min-height:240px;
  max-height:420px;
  object-fit:cover;
  background:#000
}

.scan-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center
}

.scan-box{
  width:78%;
  height:110px;
  border:3px solid #22c55e;
  border-radius:12px;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.35),
    0 0 20px rgba(34,197,94,.7)
}

.scan-line{
  position:absolute;
  left:12%;
  right:12%;
  height:2px;
  background:#ef4444;
  box-shadow:0 0 8px #ef4444;
  animation:scanline 2s infinite ease-in-out
}

@keyframes scanline{
  0%,100%{
    top:38%
  }
  50%{
    top:62%
  }
}

.reader-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px;
  text-align:center;
  color:white;
  background:linear-gradient(transparent,rgba(0,0,0,.8))
}

.reader-info span{
  font-size:13px
}

.close-scanner{
  position:absolute;
  top:10px;
  right:10px;
  z-index:5;
  min-height:40px;
  padding:8px 12px;
  background:rgba(0,0,0,.7);
  color:white;
  border:1px solid rgba(255,255,255,.4)
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  z-index:9999;
  transform:translate(-50%,120px);
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:12px;
  transition:.25s;
  max-width:90%;
  text-align:center;
  box-shadow:0 5px 20px #0004
}

.show{
  transform:translate(-50%,0)
}

.status{
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  background:#eef2ff;
  font-size:12px;
  color:#3730a3;
  display:none;
  text-align:center;
  font-weight:600
}

.status.show{
  display:block
}

@media(max-width:480px){
  main{
    padding:7px
  }

  header,.card{
    border-radius:14px;
    padding:13px
  }

  .row{
    gap:6px
  }

  button{
    padding:11px 8px
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>📦 Stock Compartido</h1>
  <div class="sub">Todos los celulares usan el mismo stock.</div>
</header>

<div class="kp">
  <div class="k">
    <b id="np">0</b>
    <span>PRODUCTOS</span>
  </div>

  <div class="k">
    <b id="nu">0</b>
    <span>UNIDADES</span>
  </div>

  <div class="k">
    <b id="nm">0</b>
    <span>MOVIMIENTOS</span>
  </div>
</div>

<section class="card">

  <label>Código de barras</label>

  <div class="row">
    <input
      id="code"
      inputmode="numeric"
      placeholder="Escanear o escribir"
      autocomplete="off"
    >

    <button id="scan" class="blue">
      📷 Escanear
    </button>
  </div>

  <div id="reader">

    <button id="closeScanner" class="close-scanner">
      ✕ Cerrar
    </button>

    <video
      id="video"
      playsinline
      muted
      autoplay
    ></video>

    <div class="scan-overlay">
      <div class="scan-box"></div>
      <div class="scan-line"></div>
    </div>

    <div class="reader-info">
      <span>Apuntá al código de barras</span>
    </div>

  </div>

  <div id="cameraStatus" class="status"></div>

  <label>Producto (opcional)</label>

  <input
    id="name"
    placeholder="Nombre del producto"
    autocomplete="off"
  >

  <label>Cantidad de ingreso</label>

  <input
    id="qty"
    type="number"
    min="1"
    value="1"
    inputmode="numeric"
  >

  <button
    id="add"
    class="green"
    style="width:100%;margin-top:12px"
  >
    ➕ AGREGAR INGRESO
  </button>

  <p class="note">
    Cada ingreso se suma al stock central.
    Las operaciones simultáneas se procesan de forma atómica.
  </p>

</section>

<section class="card">

  <label>Buscar</label>

  <input
    id="search"
    placeholder="Código o producto"
    autocomplete="off"
  >

  <div class="table">

    <table>

      <thead>
        <tr>
          <th>Código</th>
          <th>Producto</th>
          <th>Stock</th>
          <th>Actualizado</th>
        </tr>
      </thead>

      <tbody id="body"></tbody>

    </table>

  </div>

</section>

<section class="card">

  <div class="row">

    <button id="csv" class="blue">
      ⬇️ Exportar CSV
    </button>

    <button id="refresh" class="gray">
      🔄 Actualizar
    </button>

  </div>

</section>

</main>

<div id="toast" class="toast"></div>

<!-- ZXing -->
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SB_URL =
  "https://hqwzuocvczvdhrslyqbp.supabase.co";

const SB_KEY =
  "sb_publishable_68lrYJk9x6RU2vJE-IzcvA_s1tzb1AH";

const db =
  supabase.createClient(SB_URL, SB_KEY);

let rows = [];
let scanning = false;
let scannerControls = null;
let scannerReader = null;

/* =========================================
   UTILIDADES
========================================= */

const $ = id => document.getElementById(id);

function toast(message){
  const t = $("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer =
    setTimeout(() => {
      t.classList.remove("show");
    }, 2800);
}

function setCameraStatus(msg, isError = false){
  const el = $("cameraStatus");
  if(!el) return;
  if(msg){
    el.textContent = msg;
    el.classList.add("show");
    el.style.color = isError ? "#dc2626" : "#3730a3";
    el.style.background = isError ? "#fef2f2" : "#eef2ff";
  }else{
    el.textContent = "";
    el.classList.remove("show");
  }
}

/* =========================================
   CARGAR STOCK
========================================= */

async function load(){
  try{
    const r = await db
      .from("productos_stock")
      .select("*")
      .order("nombre");

    if(r.error){
      console.error(r.error);
      toast("Ejecutá primero el SQL de configuración");
      return;
    }

    rows = r.data || [];
    render();

  }catch(error){
    console.error(error);
    toast("No se pudo cargar el stock");
  }
}

/* =========================================
   RENDER TABLA
========================================= */

function render(){
  const q =
    $("search").value
      .toLowerCase()
      .trim();

  const filtered =
    rows.filter(p =>
      ((p.codigo || "") + " " + (p.nombre || ""))
        .toLowerCase()
        .includes(q)
    );

  $("np").textContent = rows.length;

  $("nu").textContent =
    rows
      .reduce((s,p) => s + Number(p.stock || 0), 0)
      .toLocaleString("es-AR");

  $("nm").textContent =
    rows
      .reduce((s,p) => s + Number(p.movimientos || 0), 0)
      .toLocaleString("es-AR");

  $("body").innerHTML =
    filtered.map(p => `
      <tr>
        <td>
          <b>${escapeHtml(p.codigo)}</b>
        </td>
        <td>
          ${escapeHtml(p.nombre || "Sin nombre")}
        </td>
        <td>
          <b>
            ${Number(p.stock || 0).toLocaleString("es-AR")}
          </b>
        </td>
        <td>
          ${p.actualizado_en
            ? new Date(p.actualizado_en).toLocaleString("es-AR")
            : "-"
          }
        </td>
      </tr>
    `).join("")
    ||
    `
      <tr>
        <td
          colspan="4"
          style="text-align:center;padding:20px"
        >
          Sin productos
        </td>
      </tr>
    `;
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================
   AGREGAR INGRESO
========================================= */

async function add(){
  const code = $("code").value.trim();
  const quantity = parseInt($("qty").value, 10);
  const name = $("name").value.trim();

  if(!code){
    toast("Ingresá o escaneá un código");
    $("code").focus();
    return;
  }

  if(!Number.isInteger(quantity) || quantity < 1){
    toast("La cantidad debe ser mayor a 0");
    $("qty").focus();
    return;
  }

  $("add").disabled = true;

  try{
    const r = await db.rpc(
      "ingresar_stock",
      {
        p_codigo: code,
        p_nombre: name,
        p_cantidad: quantity
      }
    );

    if(r.error){
      console.error(r.error);
      toast("No se pudo registrar el ingreso");
      return;
    }

    const stock = Number(r.data?.stock ?? r.data ?? 0);

    $("qty").value = 1;
    $("name").value = "";

    toast("Ingreso registrado. Stock: " + stock.toLocaleString("es-AR"));
    await load();

  }catch(error){
    console.error(error);
    toast("Error al registrar el ingreso");
  }finally{
    $("add").disabled = false;
  }
}

/* =========================================
   ESCÁNER (CORREGIDO)
========================================= */

async function startScanner(){
  if(scanning) return;

  setCameraStatus("Iniciando cámara...");

  if(!window.isSecureContext){
    const msg = "La cámara requiere HTTPS. Abrí la web con https://";
    toast(msg);
    setCameraStatus(msg, true);
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const msg = "Tu navegador no admite acceso a la cámara.";
    toast(msg);
    setCameraStatus(msg, true);
    return;
  }

  if(typeof ZXingBrowser === "undefined"){
    const msg = "No se cargó la librería de escaneo. Verificá tu conexión.";
    toast(msg);
    setCameraStatus(msg, true);
    return;
  }

  stopScanner();

  const video = $("video");
  $("reader").style.display = "block";
  scanning = true;

  try{
    // Configurar sugerencias de lectura (TRY_HARDER mejora lectura de códigos 1D)
    const hints = new Map();
    if(ZXingBrowser.DecodeHintType && ZXingBrowser.DecodeHintType.TRY_HARDER){
      hints.set(ZXingBrowser.DecodeHintType.TRY_HARDER, true);
    }

    scannerReader = new ZXingBrowser.BrowserMultiFormatReader(hints);

    // Solicitar cámara trasera directamente por constraints
    const constraints = {
      video: {
        facingMode: { ideal: "environment" },
        width: { min: 640, ideal: 1280, max: 1920 },
        height: { min: 480, ideal: 720, max: 1080 }
      }
    };

    setCameraStatus("Solicitando acceso a la cámara...");

    scannerControls = await scannerReader.decodeFromConstraints(
      constraints,
      video,
      (result, error) => {
        if(!scanning) return;

        if(result){
          const code = result.getText().trim();
          if(!code) return;

          scanning = false;
          $("code").value = code;

          stopScanner();

          $("qty").focus();
          $("qty").select();

          if(navigator.vibrate){
            navigator.vibrate([100, 50, 100]);
          }

          toast("Código leído: " + code);
        }
      }
    );

    setCameraStatus("Cámara activa. Apuntá al código de barras.");
    toast("Apuntá al código de barras");

  }catch(error){
    console.warn("Fallo decodeFromConstraints, intentando selección manual:", error);

    // Fallback: si falla por restricción de resolución/constraints, reintentar con lista de dispositivos
    try{
      setCameraStatus("Buscando dispositivos...");

      // Forzar solicitud previa de permiso para que listVideoInputDevices devuelva etiquetas válidas
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
      tempStream.getTracks().forEach(t => t.stop());

      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

      if(!devices || !devices.length){
        throw new DOMException("No camera found", "NotFoundError");
      }

      let selected = devices.find(d =>
        /back|rear|environment|trasera|posterior/i.test(d.label || "")
      );

      if(!selected){
        selected = devices[devices.length - 1];
      }

      scannerControls = await scannerReader.decodeFromVideoDevice(
        selected.deviceId,
        video,
        (result, error) => {
          if(!scanning) return;

          if(result){
            const code = result.getText().trim();
            if(!code) return;

            scanning = false;
            $("code").value = code;

            stopScanner();

            $("qty").focus();
            $("qty").select();

            if(navigator.vibrate){
              navigator.vibrate([100, 50, 100]);
            }

            toast("Código leído: " + code);
          }
        }
      );

      setCameraStatus("Cámara activa. Apuntá al código de barras.");
      toast("Apuntá al código de barras");

    }catch(fallbackError){
      console.error("Error final al abrir la cámara:", fallbackError);
      stopScanner();

      let errorMsg = "No se pudo abrir la cámara.";
      if(fallbackError && fallbackError.name === "NotAllowedError"){
        errorMsg = "Permiso de cámara denegado. Concedé permisos en la barra de direcciones.";
      }else if(fallbackError && fallbackError.name === "NotFoundError"){
        errorMsg = "No se encontró ninguna cámara en el dispositivo.";
      }else if(fallbackError && fallbackError.name === "NotReadableError"){
        errorMsg = "La cámara está siendo ocupada por otra app.";
      }

      toast(errorMsg);
      setCameraStatus(errorMsg, true);
    }
  }
}

/* =========================================
   DETENER ESCÁNER
========================================= */

function stopScanner(){
  scanning = false;

  try{
    if(scannerControls && typeof scannerControls.stop === "function"){
      scannerControls.stop();
    }
  }catch(error){
    console.warn("Error deteniendo controles ZXing:", error);
  }
  scannerControls = null;

  try{
    if(scannerReader && typeof scannerReader.reset === "function"){
      scannerReader.reset();
    }
  }catch(error){
    console.warn("Error reseteando lector ZXing:", error);
  }
  scannerReader = null;

  const video = $("video");
  if(video){
    try{
      if(video.srcObject){
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => {
          try{ track.stop(); }catch(e){}
        });
      }
    }catch(e){}

    try{ video.pause(); }catch(e){}
    video.srcObject = null;
  }

  $("reader").style.display = "none";
  setCameraStatus("");
}

/* =========================================
   CSV
========================================= */

function csv(){
  const cell = value => `"${String(value ?? "").replaceAll('"','""')}"`;

  const header = "\uFEFFCodigo;Producto;Stock;Movimientos;Actualizado\n";

  const content =
    rows
      .map(p =>
        [
          p.codigo,
          p.nombre,
          p.stock,
          p.movimientos,
          p.actualizado_en
        ]
        .map(cell)
        .join(";")
      )
      .join("\n");

  const blob = new Blob([header + content], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "stock_compartido.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================
   EVENTOS
========================================= */

$("add").onclick = add;

$("scan").onclick = () => {
  if(scanning){
    stopScanner();
  }else{
    startScanner();
  }
};

$("closeScanner").onclick = stopScanner;
$("search").oninput = render;
$("refresh").onclick = load;
$("csv").onclick = csv;

$("qty").onkeydown = event => {
  if(event.key === "Enter"){
    event.preventDefault();
    add();
  }
};

$("code").onkeydown = event => {
  if(event.key === "Enter"){
    event.preventDefault();
    $("qty").focus();
  }
};

document.addEventListener("visibilitychange", () => {
  if(document.hidden && scanning){
    stopScanner();
  }
});

/* =========================================
   INICIO
========================================= */

(async function(){
  await load();

  db
    .channel("stock")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"productos_stock"
      },
      () => load()
    )
    .subscribe();
})();

</script>

</body>
</html>
